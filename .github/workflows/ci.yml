name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --locked builds cargo-audit with its own pinned dependencies, which
      # compile on the toolchain pinned in rust-toolchain.toml.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies (RustSec)
        run: cargo audit
